name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (PyAudio build)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Run tests
        run: uv run --python 3.12 --with pytest --with pytest-asyncio --with httpx pytest -q
